name: sports-arena

services:
  postgres:
    container_name: sports-arena-postgres
    image: sports-arena/postgres
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
    ports:
      - "5432:5432"
    networks:
      - sports-arena
    volumes:
      # Persistent storage data
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql

  adminer:
    container_name: sports-arena-adminer
    image: adminer:latest
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=sports-arena-postgres
    ports:
      - "8888:8080"
    networks:
      - sports-arena
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: sports-arena-postgres-data

networks:
  sports-arena:
    name: sports-arena-network
    driver: bridge
