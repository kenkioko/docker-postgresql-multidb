name: docker-multidb

services:
  postgres:
    container_name: docker-multidb-postgres
    image: multidb-postgres:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
    ports:
      - "5432:5432"
    networks:
      - multidb
    volumes:
      # Persistent storage data
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql

  adminer:
    container_name: docker-multidb-adminer
    image: adminer:latest
    environment:
      - ADMINER_DEFAULT_SERVER=docker-multidb-postgres
    ports:
      - "8888:8080"
    networks:
      - multidb
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: multidb-postgres-data

networks:
  multidb:
    name: multidb-network
    driver: bridge
